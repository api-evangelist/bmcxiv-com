  free, no-identifier MCP tools that let an agent exercise the product before any approval or payment: a decision
  aid and a synthetic report whose shape matches the paid ExposureReport. Quoted from the provider: "Free
  evaluation: assess_owner_security_need and preview_synthetic_breach_report perform no lookup and require no
  identifier or payment." No test values are invented here.
