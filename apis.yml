aid: bmcxiv-com
name: BMC XIV
description: 'BMC XIV operates Breach402, an agent-native breach-intelligence service at breach402.bmcxiv.com.
  An AI agent verifies that its owner controls an exact email address (free, by confirmation link or one-time
  code), then pays $1.00 USDC on Solana through x402 for one lookup across a corpus the provider describes as
  more than 13.3 billion indexed breach records, receiving the complete private records plus deterministic
  cyber-expert and social-engineering mitigation guidance. The surface is published for machines first: an
  OpenAPI 3.1 contract, a remote MCP server with eight tools and five resources, an A2A 0.3 agent card, an
  llms.txt, and five portable Agent Skill / trust documents. It is explicitly not a third-party lookup,
  surveillance or screening tool.'
