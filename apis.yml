apis:
- name: Breach402 API
  description: 'Owner-verified breach exposure checks for autonomous agents. Twelve operations: five discovery
    GETs that serve the portable skill, trust contract and recommendation guide as Markdown; an owner-verification
    flow (create enrollment, poll status, submit one-time code, revoke); a two-step paid check (prepare returns a
    short-lived signed payment ticket, run answers 402 until the x402 USDC payment settles, then queues the lookup);
    and a bearer-protected report retrieval that returns complete raw breach records to the verified customer agent.
    Bearer capabilities (poll_token, scan_token, report_token) are issued per flow; there are no accounts or API keys.'
